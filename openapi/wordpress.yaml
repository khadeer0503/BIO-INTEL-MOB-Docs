openapi: 3.0.3
info:
  title: BIO-INTEL-MOB Pilot REST API
  version: 0.2.0
  description: >
    Public dataset and REST discovery operations for the eight BIO-INTEL-MOB
    pilot sites. Route registrations and dataset responses were checked on 20
    October 2026. Schemas describe public metadata and observed response shapes,
    not undocumented backend validation rules. No write operations were
    registered in the project api namespace at the time of verification.
servers:
  - url: https://rome.bio-intel-mob.eu/wp-json
    description: Rome pilot
  - url: https://cascais.bio-intel-mob.eu/wp-json
    description: Cascais pilot
  - url: https://kyiv.bio-intel-mob.eu/wp-json
    description: Kyiv pilot
  - url: https://melsungen.bio-intel-mob.eu/wp-json
    description: Melsungen pilot
  - url: https://rhodes.bio-intel-mob.eu/wp-json
    description: Rhodes pilot
  - url: https://riga.bio-intel-mob.eu/wp-json
    description: Riga pilot
  - url: https://urla.bio-intel-mob.eu/wp-json
    description: Urla pilot
  - url: https://vilnius.bio-intel-mob.eu/wp-json
    description: Vilnius pilot
security: []
tags:
  - name: Datasets
    description: Civic proposals consumed by the Unity VR application
  - name: Discovery
    description: Public WordPress REST route metadata
paths:
  /api/datasets:
    get:
      tags:
        - Datasets
      operationId: listDatasets
      summary: Retrieve datasets
      description: >
        Returns the selected pilot's dataset metadata and civic proposals. In
        the shared reference, choose a pilot in the server selector. Each
        dedicated pilot section uses that pilot's server automatically. This
        public GET request does not require authentication. The registered route
        declares no query parameters. An empty proposals array is valid.
      responses:
        "200":
          description: Dataset metadata and civic proposals; the proposals array may be
            empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
  /:
    get:
      tags:
        - Discovery
      operationId: getRestIndex
      summary: Retrieve REST index
      description: >
        Returns public WordPress REST metadata, including registered namespaces
        and routes for the selected pilot. Routes can belong to WordPress core
        or installed plugins. Their presence does not make them BIO-INTEL-MOB
        application operations or grant permission to call them.
      responses:
        "200":
          description: Public WordPress REST index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestIndex"
      x-excluded: true
  /api:
    get:
      tags:
        - Discovery
      operationId: getProjectRoutes
      summary: Retrieve project route index
      description: >
        Returns registered routes and request argument metadata in the api
        namespace. Use this discovery response to check whether a new project
        endpoint has been deployed to the selected pilot.
      responses:
        "200":
          description: Route metadata for the project api namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceIndex"
      x-excluded: true
components:
  schemas:
    DatasetResponse:
      type: object
      description: Dataset envelope returned by the selected pilot
      example:
        id: 1
        city: Rome
        generatedAt: 2026-10-20T09:00:00+00:00
        proposals: []
      required:
        - id
        - city
        - generatedAt
        - proposals
      properties:
        id:
          type: integer
          example: 1
          description: Unique identifier for the dataset batch
        city:
          type: string
          example: Rome
          description: Name of the selected pilot city
        generatedAt:
          type: string
          format: date-time
          example: 2026-10-19T10:38:40+00:00
          description: Timestamp when the response was generated
        proposals:
          type: array
          description: Civic proposals; the array can be empty
          items:
            $ref: "#/components/schemas/Proposal"
    Proposal:
      type: object
      required:
        - id
        - title
        - description
        - latitude
        - longitude
        - category
        - votes
        - status
        - severity
        - date
      properties:
        id:
          type: integer
          example: 314
        title:
          type: string
          description: Proposal title
        description:
          type: string
          description: Description of the reported issue or proposal
        latitude:
          type: number
          format: double
          description: WGS84 latitude in degrees
        longitude:
          type: number
          format: double
          description: WGS84 longitude in degrees
        category:
          type: string
          example: TRANSPORT
        votes:
          type: integer
          example: 0
        status:
          type: string
          example: PENDING
        severity:
          type: string
          example: MEDIUM
        date:
          type: string
          format: date
          example: 2026-10-08
        images:
          type: array
          description: Image URLs associated with the proposal
          items:
            type: string
            format: uri
        video:
          type: string
          nullable: true
          example: null
    RestIndex:
      type: object
      properties:
        name:
          type: string
          description: WordPress site name
        namespaces:
          type: array
          items:
            type: string
          description: Registered REST namespaces
        routes:
          type: object
          additionalProperties:
            type: object
          description: Route paths mapped to their registration metadata
      additionalProperties: true
    NamespaceIndex:
      type: object
      properties:
        namespace:
          type: string
          example: api
        routes:
          type: object
          additionalProperties:
            type: object
          description: Route paths, methods, and argument metadata for this namespace
      additionalProperties: true
